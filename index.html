<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Valora • Finanças</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#172554">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F4F6FA; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased pb-24">

    <!-- Header / Topo -->
    <header class="bg-blue-950 text-white pt-6 pb-8 px-5 rounded-b-3xl shadow-lg">
        <div class="flex justify-between items-center mb-4">
            <div>
                <span class="text-xs font-semibold uppercase tracking-wider text-blue-300">VALORA • FINANÇAS</span>
                <h1 class="text-2xl font-bold tracking-tight">Visão Geral</h1>
            </div>
            <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-500 text-white w-10 h-10 rounded-full flex items-center justify-center text-xl shadow-md transition active:scale-95">+</button>
        </div>

        <!-- Card de Saldo Principal -->
        <div class="bg-white/10 backdrop-blur-md border border-white/10 rounded-2xl p-4 shadow-inner">
            <p class="text-xs text-blue-200 uppercase font-medium">Saldo do Mês</p>
            <h2 id="saldoTotal" class="text-3xl font-extrabold mt-1 tracking-tight text-white">- R$ 1.498,65</h2>
            <p id="saldoStatus" class="text-xs mt-1 text-red-300 font-medium">As despesas superam as receitas</p>
        </div>
    </header>

    <!-- Indicadores Rápidos -->
    <main class="px-5 -mt-4 space-y-4">
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <span class="text-xs font-semibold text-slate-400 uppercase">Receitas</span>
                <p id="totalReceitas" class="text-lg font-bold text-emerald-600 mt-1">R$ 5.480,00</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <span class="text-xs font-semibold text-slate-400 uppercase">Gastos</span>
                <p id="totalGastos" class="text-lg font-bold text-slate-900 mt-1">R$ 6.978,65</p>
            </div>
        </div>

        <!-- Barra de Progresso Pago x A Pagar -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-2">
            <div class="flex justify-between text-xs font-semibold">
                <span class="text-emerald-600">Pago: <span id="valPago">R$ 366,00</span></span>
                <span class="text-rose-600">A Pagar: <span id="valPendente">R$ 6.612,65</span></span>
            </div>
            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden flex">
                <div id="barraPago" class="bg-emerald-500 h-full transition-all duration-500" style="width: 5%;"></div>
                <div id="barraPendente" class="bg-rose-500 h-full transition-all duration-500" style="width: 95%;"></div>
            </div>
        </div>

        <!-- Abas de Navegação (Receitas vs Despesas) -->
        <div class="flex bg-slate-200 p-1 rounded-xl">
            <button onclick="switchTab('despesas')" id="btnTabDespesas" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-slate-900 shadow-sm transition">Despesas</button>
            <button onclick="switchTab('receitas')" id="btnTabReceitas" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 transition">Receitas</button>
        </div>

        <!-- Lista de Transações -->
        <div id="listaTransacoes" class="space-y-2.5"></div>
    </main>

    <!-- Modal de Adicionar / Editar -->
    <div id="modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-end z-50 transition-opacity">
        <div class="bg-white w-full rounded-t-3xl p-6 space-y-4 animate-in slide-in-from-bottom duration-300">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg text-slate-900" id="modalTitle">Novo Lançamento</h3>
                <button onclick="closeModal()" class="text-slate-400 text-xl font-bold">&times;</button>
            </div>
            <form id="formTransacao" onsubmit="salvarTransacao(event)" class="space-y-3">
                <input type="hidden" id="transId">
                <div>
                    <label class="text-xs font-semibold text-slate-500">Tipo</label>
                    <select id="tipo" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium">
                        <option value="despesa">Despesa</option>
                        <option value="receita">Receita</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-500">Descrição</label>
                    <input type="text" id="descricao" required placeholder="Ex: Supermercado" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-semibold text-slate-500">Valor (R$)</label>
                        <input type="number" step="0.01" id="valor" required placeholder="0,00" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-500">Status</label>
                        <select id="status" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium">
                            <option value="pago">Pago / Recebido</option>
                            <option value="pendente">A Pagar / Pendente</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-md transition active:scale-95 mt-2">Salvar</button>
            </form>
        </div>
    </div>

    <!-- Script Principal e Service Worker -->
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed: ', err));
            });
        }
    </script>
</body>
</html>
